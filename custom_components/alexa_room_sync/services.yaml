preview:
  name: Preview (read-only)
  description: >-
    Read-only. Builds the HA area -> Alexa group plan and logs it (matched and
    unmatched devices). Never writes to Alexa. Run this first.
  fields:
    config_entry_id:
      name: Alexa account
      description: Which account to use. Only needed if you've set up more than one.
      required: false
      selector:
        config_entry:
          integration: alexa_room_sync
    area_id:
      name: Area
      description: Limit the preview to a single HA area (optional).
      required: false
      selector:
        area:

list_groups:
  name: List existing Alexa groups
  description: Read-only. Lists the groups that already exist in your Alexa account.

sync_area:
  name: Sync one area
  description: >-
    Create or update the Alexa group for ONE HA area. Use this for the first, reversible
    test. Writes only if 'apply' is true AND writes are confirmed in the integration
    options; otherwise behaves as a preview.
  fields:
    config_entry_id:
      name: Alexa account
      description: Which account to use. Only needed if you've set up more than one.
      required: false
      selector:
        config_entry:
          integration: alexa_room_sync
    area_id:
      name: Area
      description: The HA area to sync.
      required: true
      selector:
        area:
    apply:
      name: Apply (write to Alexa)
      description: >-
        If true, actually write the group. Requires the write-confirmation option to be
        enabled. If false/omitted, this is a dry run.
      required: false
      default: false
      selector:
        boolean:

sync:
  name: Sync all areas
  description: >-
    Bring Alexa groups in line with HA areas: create missing groups, update the devices
    and name of groups this integration manages, and delete managed groups whose area is
    skipped, removed or empty. Groups you made yourself are never touched, and Echos
    you added to a group are kept. Writes only if 'apply' is true AND writes are
    confirmed in options; otherwise a dry run.
  fields:
    config_entry_id:
      name: Alexa account
      description: Which account to use. Only needed if you've set up more than one.
      required: false
      selector:
        config_entry:
          integration: alexa_room_sync
    apply:
      name: Apply (write to Alexa)
      description: If true, actually make the changes (requires the options confirmation).
      required: false
      default: false
      selector:
        boolean:

dump_appliances:
  name: Dump Alexa appliances (read-only diagnostic)
  description: >-
    Read-only. Returns a redacted structural summary of each device-list source, the
    GraphQL query the sync uses and the legacy /api/phoenix (key frequencies, where an HA
    entity_id appears, a few redacted samples), to debug entity->appliance matching.
    Never writes to Alexa.
  fields:
    sample_count:
      name: Sample count
      description: How many full (redacted) appliance records to include.
      required: false
      default: 4
      selector:
        number:
          min: 0
          max: 20
          mode: box

probe_endpoints:
  name: Probe endpoints
  description: Read-only diagnostic — try candidate Alexa device-list endpoints.

probe_lists:
  name: Probe Alexa lists (read-only diagnostic)
  description: >-
    Read-only. Tries the candidate Alexa list endpoints (/api/namedLists and friends) and
    reports which still answer, how many rows they return and the list names — never the
    contents of a list. Use this when the Alexa to-do entities are missing or empty.

remove_managed_rooms:
  name: Remove the Alexa groups it manages (created or adopted)
  description: >-
    Deletes the Alexa groups this integration created or adopted. A group that also holds a device you
    added yourself (an Echo) keeps that device and is just released.
  fields:
    config_entry_id:
      name: Alexa account
      description: Which account to use. Only needed if you've set up more than one.
      required: false
      selector:
        config_entry:
          integration: alexa_room_sync
    confirm:
      name: Confirm
      description: Must be true.
      required: true
      selector:
        boolean:
